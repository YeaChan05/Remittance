name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  impact-analysis:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      full_run: ${{ steps.impacted.outputs.full_run }}
      skip_run: ${{ steps.impacted.outputs.skip_run }}
      assemble_tasks: ${{ steps.impacted.outputs.assemble_tasks }}
      test_tasks: ${{ steps.impacted.outputs.test_tasks }}
      integration_test_tasks: ${{ steps.impacted.outputs.integration_test_tasks }}
      non_aggregate_integration_test_tasks: ${{ steps.impacted.outputs.non_aggregate_integration_test_tasks }}
      aggregate_integration_test_tasks: ${{ steps.impacted.outputs.aggregate_integration_test_tasks }}
      core_verification_tasks: ${{ steps.impacted.outputs.core_verification_tasks }}
      verification_tasks: ${{ steps.impacted.outputs.verification_tasks }}
      summary: ${{ steps.impacted.outputs.summary }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve git range
        id: git-range
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve impacted modules
        id: impacted
        shell: bash
        run: |
          bash ./.github/scripts/resolve-impacted-modules.sh \
            --base "${{ steps.git-range.outputs.base_sha }}" \
            --head "${{ steps.git-range.outputs.head_sha }}"

      - name: Print impact summary
        shell: bash
        run: |
          cat <<'EOF'
          ${{ steps.impacted.outputs.summary }}
          EOF

      - name: Skip CI for non-functional changes
        if: steps.impacted.outputs.skip_run == 'true'
        run: echo "Skipping Gradle CI because only non-functional files changed."

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version-file: .sdkmanrc

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and coverage
        run: ./gradlew build jacocoRootReport

      - name: Upload coverage
        uses: madrapps/jacoco-report@v1.2
        with:
          title: Jacoco Coverage Report
          paths: ${{ github.workspace }}/build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 85

  verify-core:
    if: github.event_name == 'pull_request' && needs.impact-analysis.outputs.skip_run != 'true' && needs.impact-analysis.outputs.core_verification_tasks != ''
    needs: impact-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version-file: .sdkmanrc

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Core verification
        run: ./gradlew ${{ needs.impact-analysis.outputs.core_verification_tasks }}

  verify-aggregate:
    if: github.event_name == 'pull_request' && needs.impact-analysis.outputs.skip_run != 'true' && needs.impact-analysis.outputs.aggregate_integration_test_tasks != ''
    needs: impact-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version-file: .sdkmanrc

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Aggregate integration verification
        run: ./gradlew ${{ needs.impact-analysis.outputs.aggregate_integration_test_tasks }}
